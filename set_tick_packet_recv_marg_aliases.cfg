echo "Set Tick & Packet Recieve Margin Spew Timing Intervals Aliases"
alias timing_recv_negative_v00 "cl_ticktiming 0000 detail; cl_clock_recvmargin_spew_interval 0000; cl_tickpacket_recvmargin_spew_interval 0000"
alias nt00 "timing_recv_negative_v00; echo Tick Timing & Packet Recieve Margin off 00sec Print/Spew Interval; nts"
//
alias timing_recv_positive_v01 "cl_ticktiming 1920 detail; cl_clock_recvmargin_spew_interval 1920; cl_tickpacket_recvmargin_spew_interval 1920"
alias nt01 "timing_recv_positive_v01; echo Tick Timing & Packet Recieve Margin v01 30sec Print/Spew Interval; nts" // old time value 1875 29 sec?
//
alias timing_recv_positive_v02 "cl_ticktiming 7680 detail; cl_clock_recvmargin_spew_interval 7680; cl_tickpacket_recvmargin_spew_interval 7680"
alias nt02 "timing_recv_positive_v02; echo Tick Timing & Packet Recieve Margin v02 04min Print/Spew Interval; nts"
//
alias nq01 "net_limit_sv_recvbuffer_kb 64; net_limit_sv_recvbuffer_msg 50; cl_clockdrift_max_ticks 1; sv_clockcorrection_msecs 15; net_option OutOfOrderCorrectionWindowMicroseconds 500"
alias nq02 "net_limit_sv_recvbuffer_kb 96; net_limit_sv_recvbuffer_msg 75; cl_clockdrift_max_ticks 2; sv_clockcorrection_msecs 22; net_option OutOfOrderCorrectionWindowMicroseconds 750"