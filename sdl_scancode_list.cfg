echo "SDL_SCANCODE_BACKSLASH = 49, Located at the lower left of the return key on ISO keyboards and at the right end of the QWERTY row on ANSI keyboards."
echo "	Produces REVERSE SOLIDUS (backslash) and VERTICAL LINE in a US layout."
echo "	Produces REVERSE SOLIDUS and VERTICAL LINE in a UK Mac layout, NUMBER SIGN and TILDE in a UK Windows layout."
echo "	Produces DOLLAR SIGN and POUND SIGN in a Swiss German layout, NUMBER SIGN and APOSTROPHE in a German layout."
echo "	Produces GRAVE ACCENT and POUND SIGN in a French Mac layout, and ASTERISK and MICRO SIGN in a French Windows layout."
echo "SDL_SCANCODE_NONUSHASH = 50"
echo "	ISO USB keyboards actually use this code instead of 49 for the same key, but all OSes I've seen treat the two codes identically."
echo "	So, as an implementer, unless your keyboard generates both of those codes and your OS treats them differently, you should generate SDL_SCANCODE_BACKSLASH instead of this code."
echo "	As a user, you should not rely on this code because SDL will never generate it with most (all?) keyboards."
echo "SDL_SCANCODE_SEMICOLON = 51"
echo "SDL_SCANCODE_APOSTROPHE = 52"
echo "SDL_SCANCODE_GRAVE = 53, Located in the top left corner (on both ANSI and ISO keyboards)."
echo "	Produces GRAVE ACCENT and TILDE in a US Windows layout and in US and UK Mac layouts on ANSI keyboards."
echo "	Produces GRAVE ACCENT and NOT SIGN in a UK Windows layout, SECTION SIGN and PLUS-MINUS SIGN in US and UK Mac layouts on ISO keyboards."
echo "	Produces SECTION SIGN and DEGREE SIGN in a Swiss German layout (Mac: only on ISO keyboards)."
echo "	Produces LESS-THAN SIGN and GREATER-THAN SIGN in a Swiss German, German, or French Mac layout on ANSI keyboards."
echo "	Produces CIRCUMFLEX ACCENT and DEGREE SIGN in a German layout (Mac: only on ISO keyboards)."
echo "	Produces SUPERSCRIPT TWO and TILDE in a French Windows layout, COMMERCIAL AT and NUMBER SIGN in a French Mac layout on ISO keyboards"
echo "SDL_SCANCODE_COMMA = 54"
echo "SDL_SCANCODE_PERIOD = 55"
echo "SDL_SCANCODE_SLASH = 56"
echo "SDL_SCANCODE_CAPSLOCK = 57"
