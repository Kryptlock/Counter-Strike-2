// --- Radio 3 CMD aliases ---
// Description: Trigger Text chat and ag unique voice lines and. Text chat.
// Notes: radio1/2/3 has decimalized sub values that trigger alternative or equipped agent specific voice lines.
alias r1_fire     "radio1; menuselect 6; radio1"   // taking fire!.. need backup!
alias r1_cover    "radio1; menuselect l; radio1"   // Cover me..
alias r3_affirm   "radio3; menuselect 1; radio3"   // affirmative
alias r3_roger    "radio3; menuselect 1.1; radio3" // roger
alias r3_spotted  "radio3; menuselect 2; radio3"   // enemy spotted AKA #Chatwheel_enemyspotted
alias r3_backup   "radio3; menuselect 3; radio3"   // backup
alias r3_clear    "radio3; menuselect 4; radio3"   // sector clear AKA #Chatwheel_sectorclear
alias r3_position "radio3; menuselect 5; radio3"   // in position
alias r3_report   "radio3; menuselect 6; radio3"   // reporting in AKA #Chatwheel_report
alias r3_blow     "radio3; menuselect 7; radio3"   // get back its gonna blow
alias r3_negative "radio3; menuselect 8; radio3"   // negative
alias r3_down     "radio3; menuselect 9; radio3"   // enemy down AKA #Chatwheel_enemydown\



// --- Command= Radio Report In & Report Position ---
alias +sr3ri_rp "r3_report"
alias -sr3ri_rp "r3_position"


// --- Command= GLHF & RI + RP Nested ---
alias glhf "say ⸻ ✧GL✧ᴬᴺᴰ✧HF✧ ⸻"
alias +glhf "+sr3ri_rp"
alias -glhf "-sr3ri_rp; glhf"
alias ~glhf "+glhf; -glhf"
bind "KP_PLUS" "+glhf"


// --- Command= Quick Say GG & Remind Players To Commend Eachother ---
// Description: Say GG & remind players to commend eachother. Aliases are purposfully nested nested to execute radio cmds in chat before the say message to prevent msg obfuscation.
alias +gg_say_txt "say GG! ( •_•)>⌐■-■    Remember to commend eachother via the scoreboard by clicking them & choosing [Commend Player]" 
alias -gg_say_txt "say ⸻ (P.S. You can check multiple boxes per submission!)
alias +gg_rad_dad "r1_fire"
alias -gg_rad_dad "r1_cover"
alias +gg_txt_mom "+gg_say_txt"
alias -gg_txt_mom "-gg_say_txt"
alias +gg_txt_son "+gg_rad_dad; +gg_txt_mom"
alias -gg_txt_son "-gg_rad_dad; -gg_txt_mom"
bind "KP_MULTIPLY" "+gg_txt_son"


// --- Command= Quick Say GG + Auto-Vote Next Map ---
alias +gg "+v1;  r3_down; r3_clear"
alias -gg "-v1; cheer; ; r3_blow; say GG!⸻ ☜(ò_óˇ)☞"
bind "KP_MINUS" "+gg"; echo "Qucksay GG & or Commend bind loaded"



// --- Command= Radio Report Enemy Spotted ---
// Description: On key press and release, report via radio voice line enemy spotted followed by a custom chat message on key release.  
alias c_emote_fight "say found a fight ผ(̀•_́•ผ)"
alias +sr3spot_fight "r3_spotted"
alias -sr3spot_fight "c_emote_fight" 


// --- Command= Radio Report Enemy Down & Area Is Clear ---
// Description: On key press and release, report via radio voice lines enemy down and on key release report area clear followed by a custom chat message.  
alias c_emote_dead "say He dead ☠"
alias +sr3_down_clear "r3_down"
alias -sr3_down_clear "r3_clear; c_emote_dead"


// --- Command= Radio Report Combo R3_Spotted/Down/Clear Multi-bind on 1 Key ---
// Description: Combines alias commands Radio Report Enemy spotted + Radio Report Enemy Down & Area Is Clear Into a single a single keybind for greater control efficiency. 
alias +r3_edac_a "+sr3spot_fight"
alias -r3_edac_a "-sr3spot_fight; bind KP_DIVIDE +r3_edac_b"
alias +r3_edac_b "+sr3_down_clear"
alias -r3_edac_b "-sr3_down_clear; bind KP_DIVIDE +r3_edac_a"
bind "KP_DIVIDE" "+r3_edac_a"


