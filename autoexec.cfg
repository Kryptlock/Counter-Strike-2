//--- Command= Escape Aliased ---
// Description: Simulate press key ESC 
alias esc "escape"


//--- Command= Fast Developer + Verbose Logging Toggle On/Off ---
// Description: Enables client Developer state & logging/output at the at various verbosity levels.
//-- Developer 3 (Verbose + Logging)
alias d3 "developer 3; echo 'Developer mode state 3 CMD executed. logging'"
//
//-- Developer 0 (Disabled)
alias d0 "developer 0; echo 'Developer mode state 0 CMD executed'"


//--- Command= Set Positive Log Flags ---
// Description: Restricts console log prints from various flag types Even with developer mode enabled (in-game console only)
// -- alias Flag '+DoNotEcho' --
alias print_less "d3; exec log_flags_pos_dne.cfg; echo Executed CMD print_less"
//
// -- Shortcode Set Positive Log Flags + Developer Mode 0 & Hide Console --
alias ] "print_less; d0; hideconsole; esc"
//
//
//--- Command= Set Negitive Log Flags ---
// Description: Remove prior set '+donotecho' from log flags
// -- Alias Flag '-DoNotEcho' --
alias print_more "d3; exec log_flags_pos_dne.cfg; echo Executed CMD print_more"
//
// -- Shortcode Set Negative Log Flags + Dev 3 & Hide Console --
alias [ "d3; print_more; hideconsole; esc"
//
//
//--- Command= Set Colors Log Flags ---
// Description: set log flags to assign custom user specified colors to text output to the console for various logging channels.
alias log_colors "exec log_colors.cfg; echo Executed CMD log_colors"
log_colors


//--- Command= Print MultiStats ---
// Description: Print various network & client stats from cmds located in large_print_stats.cfg. This prints a very large report of results
alias ss "exec large_print_stats.cfg; callvote_kick_template"
alias +ss "d3; snd_tv050; snd_mmenuprh1; net_showudp 1; echo 'net_showudp 1'"
alias -ss "net_showudp 0; echo 'net_showudp 0'; ss; d0; snd_tv050; snd_smenusel1;toggleconsole"
bind "X" "+ss"
echo "Print MultiStats CMD loaded"


//--- Command= Async Print MultiStats ---
// Description: Prints a very large report of results. Requires sv_cheats 1 to function properly. Executes various network & client stats related commands asynchronously located autostats.cfg.
alias as "exec_async autostats.cfg"


//--- Command= FindFlags All Flags ---
// Description: Excutes 'findflags' with all related sub options.
alias findflags_a "[;findflags DEVELOPMENTONLY;findflags GAMEDLL;findflags CLIENTDLL;findflags SPONLY;findflags ARCHIVE;findflags NOTIFY;findflags USERINFO;findflags UNLOGGED;findflags REPLICATED;findflags PROTECTED;findflags PER_USER;findflags DONTRECORD"
alias findflags_b "findflags RELEASE;findflags MENUBAR_ITEM;findflags LINKED_CONCOMMAND;findflags SERVER_CAN_EXECUTE;findflags VCONSOLE_SET_FOCUS;findflags CLIENTCMD_CAN_EXECUTE;findflags SERVER_CANNOT_QUERY;findflags EXECUTE_PER_TICK;findflags CHEAT;]"
alias +flags "[;findflags_a"
alias -flags "findflags_b;]""
alias fflags "+flags;-flags"
//bind " " "+flags"


//--- Command= Async Quick HW Performace Overview ---
// Description: To be used at teammenu on de_dust2. Asynchronusly executes contents in custom cfg 'quickperf' Performs A quick HW/SW test in a controlled low computationally intense enviroment.
alias qp "exec_async quickperf.cfg"
bind "F4" "qp"
echo "Initiated keybind to exec_async quickperf.cfg"


//--- Command= Full update and fetch stats ---
// Description: Lesser detailed stats with cl_fullupdate cmd
alias cfus "developer 3; echo 'Client requesting full update post verbose stats fetch'; ss; cl_fullupdate; ss; echo 'Client request was sent - if accepted Client will initiate another verbose stats fetch on receipt'"
echo "CL full update + fetch stats CMD loaded (alias: <cfus>)"


//--- Command= Cycle Show Fps States ---
alias "inc_showfps" "incrementvar cl_showfps 0 3 1; incrementvar cl_showpos 0 6 2"
bind "Z" "inc_showfps"


//--- Command= Toggle Damage Prediction ON/OFF  ---
// Description: Quickly toggle all local damage prediction options on/off simutaneously
alias cl_predict_fx_values "cl_predict_body_shot_fx; cl_predict_head_shot_fx; cl_predict_kill_ragdolls"
alias cl_predict_fx_toggle "toggle cl_predict_body_shot_fx; toggle cl_predict_head_shot_fx; toggle cl_predict_kill_ragdolls"
alias +toggle_cl_predict_fx "toggleconsole; echo toggle_cl_predict_fx CMD Pressed; echo --- Original Values ---; cl_predict_fx_values"
alias -toggle_cl_predict_fx "toggleconsole; echo toggle_cl_predict_fx CMD Released; cl_predict_fx_toggle; echo ---    New Values   ---;cl_predict_fx_values;esc"
bind "F9" "+toggle_cl_predict_fx"
//-- Initial Base State On App Launch Set True --
cl_predict_body_shot_fx 1; cl_predict_head_shot_fx 1; cl_predict_kill_ragdolls 1


//--- Command= Toggle Net Graphs ---
// Description: Toggle visibility of various network telemetry graphs.
alias +toggle_net_graphs_on "cl_hud_telemetry_net_misdelivery_show 2; cl_hud_telemetry_net_quality_graph_show 2; cl_hud_telemetry_serverrecvmargin_graph_show 2; echo 'network telemetry graphs enabled'"
alias -toggle_net_graphs_on "bind C +toggle_net_graphs_off;esc" 
alias +toggle_net_graphs_off "cl_hud_telemetry_net_misdelivery_show 0; cl_hud_telemetry_net_quality_graph_show 0; cl_hud_telemetry_serverrecvmargin_graph_show 0; echo network telemetry graphs disabled'"
alias -toggle_net_graphs_off "bind C +toggle_net_graphs_on;esc" 
bind "C" "+toggle_net_graphs_on"
echo "Toggle Net Graphs CMD loaded"


//--- Command= Interp CVARS ---
// Description: Enable/disable or check values for interp cvar network settings.
alias interp_cvars_negative "cl_net_buffer_ticks_use_interp 0; cl_interp_ratio 0.000000; cl_tickpacket_desired_queuelength 0; cq_buffer_bloat_msecs_max 64.000; cl_buffer_incoming_net_messages 0; cl_tickpacket_recvmargin_spew_interval 0000; cl_ticktiming print detail" 
//
alias interp_cvars_positive "cl_net_buffer_ticks_use_interp 1; cl_interp_ratio 0.5; cl_tickpacket_desired_queuelength 0; cq_buffer_bloat_msecs_max 64.000; cl_buffer_incoming_net_messages 0; cl_tickpacket_recvmargin_spew_interval 4096; cl_ticktiming 4096 detail"  
//
alias interp_cvars_getstate "cl_net_buffer_ticks_use_interp; cl_interp_ratio; cl_tickpacket_desired_queuelength; cq_buffer_bloat_msecs_max; cl_clock_correction; cl_buffer_incoming_net_messages; cl_tickpacket_recvmargin_spew_interval; cl_ticktiming print detail"
//
alias ip0 "echo --- Interp CVARS Negative ---; interp_cvars_negative; ipn" 
