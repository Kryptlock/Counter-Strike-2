// Description: Remove prior set '+donotecho' from log flags
//  -- Alias Flag '-DoNotEcho' --
alias print_more "d3; exec log_flags_pos_dne.cfg; echo Executed CMD print_more"
//
//  -- Short-code Set Negative Log Flags + Dev three & Hide Console --
alias [ "d3; print_more"


// --- Command= Set Colors Log Flags ---
// Description: set log flags to assign custom colors to various specified logging channels console text output.
alias log_colors "exec log_colors.cfg; echo Executed CMD log_colors"
log_colors


// --- Command= Print MultiStats ---
// Description: Print various network & client stats from cmds located in large_print_stats.cfg. This prints a very large report of results
alias ss "exec large_print_stats.cfg"
alias +ss "d3; snd_mmenuprh1; cq_logging_interval 65; cq_logging 1; cl_latch_report 1; cl_interpolate_report 1; net_showudp 1"
alias -ss "snd_smenusel1; cl_latch_report 0; cl_interpolate_report 0; net_showudp 0; cq_logging 0; cq_logging_interval 0; showconsole; ss; d0"
bind "X" "+ss" 


// --- Command= Async Print MultiStats ---
// Description: Exec various network & client stats related commands asynchronously. Prints very large report. Requires sv_cheats 1. 
alias as "sv_cheats 1; exec_async autostats.cfg"


// --- Command= Full update and fetch stats ---
// Description: Lesser detailed stats with cl_fullupdate cmd
alias cfus "developer 3; echo 'Client requesting full update post verbose stats fetch'; ss; cl_fullupdate; ss; echo 'Client request was sent - if accepted Client will initiate another verbose stats fetch on receipt'"
echo "CL full update + fetch stats CMD loaded (alias: <cfus>)"


// --- Command= Async Quick HW Performance Overview ---
// Description: To be used at teammenu on de_dust2. Asynchronously executes contents in custom cfg 'quickperf' Performs A quick HW/SW test in a controlled low computationally intense environment.
alias qp "exec_async quickperf.cfg"
bind "F4" "qp"; echo "Initiated keybind to exec_async quickperf.cfg"


// --- Command= Cycle Show Fps States ---
alias "inc_showfps" "incrementvar cl_showfps 0 3 1; incrementvar cl_showpos 0 6 2"
bind "Z" "inc_showfps"


// --- Command= Toggle Damage Prediction ON/OFF ---
// Description: Quickly toggle all local damage prediction options on/off simutaneously
alias cl_predict_fx_values "cl_predict_body_shot_fx; cl_predict_head_shot_fx; cl_predict_kill_ragdolls"
alias cl_predict_fx_toggle "toggle cl_predict_body_shot_fx; toggle cl_predict_head_shot_fx; toggle cl_predict_kill_ragdolls"
alias +toggle_cl_predict_fx "toggleconsole; echo toggle_cl_predict_fx CMD Pressed; echo --- Cur Values ---; cl_predict_fx_values"
alias -toggle_cl_predict_fx "toggleconsole; echo toggle_cl_predict_fx CMD Released; cl_predict_fx_toggle; echo --- New Values ---;cl_predict_fx_values; -"
bind "F9" "+toggle_cl_predict_fx" 


// --- Command= Toggle Net Graphs ---
// Description: Toggle visibility of various network telemetry graphs.
alias +toggle_net_graphs_on "cl_hud_telemetry_net_misdelivery_show 2; cl_hud_telemetry_net_quality_graph_show 2; cl_hud_telemetry_serverrecvmargin_graph_show 2; echo 'network telemetry graphs enabled'"
alias -toggle_net_graphs_on "bind C +toggle_net_graphs_off; -" 
alias +toggle_net_graphs_off "cl_hud_telemetry_net_misdelivery_show 0; cl_hud_telemetry_net_quality_graph_show 0; cl_hud_telemetry_serverrecvmargin_graph_show 0; echo network telemetry graphs disabled'"
alias -toggle_net_graphs_off "bind C +toggle_net_graphs_on; -" 
bind "C" "+toggle_net_graphs_on"; echo "Toggle Net Graphs CMD loaded"


// --- Command= Interp CVARS ---
// Description: Enable/disable or check values for interp cvar network settings.
alias interp_cvars_getvarstate "cl_tickpacket_desired_queuelength; cl_net_buffer_ticks; cl_buffer_incoming_net_messages; cl_interp_ratio; cl_net_buffer_ticks_use_interp; cl_interp; echo use togglecvar cl_latch_report 1 0; echo use togglecvar cl_interpolate_report 1 0"
alias ips "echo --- Interp CVARS GetVarState ---; interp_cvars_getvarstate; echo test_-_cmd_-cl_tickpacket_recmargin_enable"
// 
alias interp_cvars_setvars_off "cl_tickpacket_desired_queuelength 0; cl_net_buffer_ticks 0; cl_buffer_incoming_net_messages 0; cl_interp_ratio 0; cl_net_buffer_ticks_use_interp 0"
alias ip0 "echo --- InterpCVARS SetVarState ---; interp_cvars_setvars_off"
//
// -- Test Interp CVAR ratio Aliases
alias interp_cvars_positive_v1 "cl_tickpacket_desired_queuelength 0; cl_net_buffer_ticks 0; cl_buffer_incoming_net_messages 1; cl_interp_ratio 0; cl_net_buffer_ticks_use_interp 1"
alias ip1 "echo --- Interp CVARS Positive v1 ---; interp_cvars_positive_v1"
//
alias interp_cvars_positive_v2 "cl_tickpacket_desired_queuelength 0.5; cl_net_buffer_ticks 1; cl_buffer_incoming_net_messages 1; cl_interp_ratio 1; cl_net_buffer_ticks_use_interp 1"
alias ip2 "echo --- Interp CVARS Positive v2 ---; interp_cvars_positive_v2"
//
alias interp_cvars_positive_v3 "cl_net_buffer_ticks 1; cl_tickpacket_desired_queuelength 0.15625; cl_buffer_incoming_net_messages 1; cl_interp_ratio 0.25; cl_net_buffer_ticks_use_interp 1"
alias ip3 "echo --- Interp CVARS Positive v3 ---;  interp_cvars_positive_v3"
ip3


// --- Command= Toggle Tick Packet/Timing Stat Spews ---
// Description: Check status of or Enable/disable set time spew console echo of various network/interp/cli command Rx/Tx statistics
alias net_cmd_spew_getstate "cl_tickpacket_recvmargin_spew_interval; cl_ticktiming print detail"
alias nps "echo --- Net CMD Spew GetState ---; net_cmd_spew_getstate"
//
alias net_cmd_spew_positive " cl_tickpacket_recvmargin_spew_interval 1875; cl_ticktiming 1875 detail"
alias nt1 "echo --- Net CMD Spew Positive ---; net_cmd_spew_positive"
//
alias net_cmd_spew_negative "cl_tickpacket_recvmargin_spew_interval 0; cl_ticktiming 0"
alias nt0 "echo --- Net CMD Spew negative ---; net_cmd_spew_negative"


// --- Command= Set Max Bandwidth Rate ---
//  -- Ersatz Multipliers *%= 1.666%=131.072  Max 1.271%=1000.0 1.250=983.04  0.875%=688.128  0.750%=589.824  Min 0.625%=491.52  0.125%=98.304 --
// Description: Set max allowed game bandwidth rate 786432. This is the Ersatz Unlimited option rate that is set via in-game Menu options UI.
//  -- Set Rate 786432 --
alias r7 "rate 786432; echo CMD [r7] executed, rate set to 786432"
//
//  -- Set Rate 1000000 --
// Description: Set max allowed game bandwidth rate 1000000. 
alias r1 "rate 1000000; echo rate set to 1000000"


// --- Command= List bound keys ---
alias kl "key_listboundkeys; echo -- key_listboundkeys -- CMD executed"


// --- Command= FindFlags All Flags ---
// Description: Executes CMD findflags with all related sub options.
alias findflags_a "[;findflags DEVELOPMENTONLY;findflags GAMEDLL;findflags CLIENTDLL;findflags SPONLY;findflags ARCHIVE;findflags NOTIFY;findflags USERINFO;findflags UNLOGGED;findflags REPLICATED;findflags PROTECTED;findflags PER_USER;findflags DONTRECORD"
alias findflags_b "findflags RELEASE;findflags MENUBAR_ITEM;findflags LINKED_CONCOMMAND;findflags SERVER_CAN_EXECUTE;findflags VCONSOLE_SET_FOCUS;findflags CLIENTCMD_CAN_EXECUTE;findflags SERVER_CANNOT_QUERY;findflags EXECUTE_PER_TICK;findflags CHEAT;]"
alias +flags "[;findflags_a"
alias -flags "findflags_b;]"
alias fflags "+flags;-flags"

