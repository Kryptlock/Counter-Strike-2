// --- Command= Clear Console + Logfile ---
// Description: Show Console on keypress, clear all output text, then close console on key release. 
// Provides very slight increase in system performance until console viewport display buffer is re-saturated. Useful in cases where total log-output blockage via log_flags, etc, is not desired.
alias +clearall_echi "showconsole; clearall"
alias "-clearall_echi" \
bind "scancode49" "+clearall_echi"


