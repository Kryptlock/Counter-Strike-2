// Description: To be used at team menu on de_dust2. Asynchronously executes contents in custom cfg quickperf Performs A quick HW/SW test in a controlled low computationally intense environment.
alias qp "exec_async quickperf.cfg"
bind "F4" "qp"; echo "Initiated keybind to exec_async quickperf.cfg"


// --- Command= Cycle Show Fps States ---
alias "inc_showfps" "incrementvar cl_showfps 0 3 1; incrementvar cl_showpos 0 3 1"
bind "Z" "inc_showfps"


// --- Command= FindFlags All Flags ---
// Description: Executes CMD findflags with all related sub options.
alias findflags_a "findflags VCONSOLE_SET_FOCUS; findflags DONTRECORD; findflags MENUBAR_ITEM; findflags SPONLY; findflags GAMEDLL; findflags CLIENTDLL; findflags UNLOGGED; findflags ARCHIVE; findflags USERINFO; findflags NOTIFY; findflags CLIENTCMD_CAN_EXECUTE"
alias findflags_b "findflags SERVER_CAN_EXECUTE; findflags REPLICATED; findflags EXECUTE_PER_TICK; findflags SERVER_CANNOT_QUERY; findflags LINKED_CONCOMMAND; findflags PER_USER; findflags DEVELOPMENTONLY; findflags RELEASE; findflags PROTECTED; findflags CHEAT"
alias fflags "findflags_a; findflags_b"


// --- Command= Toggle Damage Prediction ON/OFF ---
// Description: Quickly toggle all local damage prediction options on/off simultaneously
alias cl_predict_fx_values "cl_predict_body_shot_fx; cl_predict_head_shot_fx; cl_predict_kill_ragdolls"
alias cl_predict_fx_toggle "toggle cl_predict_body_shot_fx; toggle cl_predict_head_shot_fx; toggle cl_predict_kill_ragdolls"
alias +toggle_cl_predict_fx "toggleconsole; echo toggle_cl_predict_fx CMD Pressed; echo --- Cur Values ---; cl_predict_fx_values"
alias -toggle_cl_predict_fx "toggleconsole; echo toggle_cl_predict_fx CMD Released; cl_predict_fx_toggle; echo --- New Values ---; cl_predict_fx_values; echi"
bind "F9" "+toggle_cl_predict_fx" 


// --- Command= Toggle Net Graphs ---
// Description: Toggle visibility of various network telemetry graphs.
alias +toggle_net_graphs_on "cl_hud_telemetry_net_misdelivery_show 2; cl_hud_telemetry_net_quality_graph_show 2; cl_hud_telemetry_serverrecvmargin_graph_show 2; echo network telemetry graphs enabled"
alias -toggle_net_graphs_on "bind C +toggle_net_graphs_off; echi" 
alias +toggle_net_graphs_off "cl_hud_telemetry_net_misdelivery_show 0; cl_hud_telemetry_net_quality_graph_show 0; cl_hud_telemetry_serverrecvmargin_graph_show 0; echo network telemetry graphs disabled"
alias -toggle_net_graphs_off "bind C +toggle_net_graphs_on; echi" 
bind "C" "+toggle_net_graphs_on"; echo "Toggle Net Graphs CMD loaded"


// --- Command= Set Max Bandwidth Rate ---
// Ersatz Multipliers *%= 1.666%=131.072  Max 1.271%=1000.0 1.250=983.04  0.875%=688.128  0.750%=589.824  Min 0.625%=491.52  0.125%=98.304
//  -- Set Rate 786432 --
// Description: Set max allowed game bandwidth rate 786432. This is the Ersatz Unlimited option rate that is set via in-game Menu options UI. 
alias r7 "rate 786432; echo CMD [r7] executed, rate set to 786432"
//  -- Set Rate 1000000 --
// Description: Set max allowed game bandwidth rate 1000000. 
alias r1 "rate 1000000; echo rate set to 1000000"


// --- Command= Interp CVARS States ---
// Description: Enable/disable or check values for interp cvar network settings.
alias interp_cvars_getvarstates "cl_net_buffer_ticks_use_interp; cl_buffer_incoming_net_messages; cl_net_buffer_ticks; cl_tickpacket_desired_queuelength; cl_interp_ratio; cl_interp"
alias ips "interp_cvars_getvarstates; echo Interp CVARS GetVarState"
exec "set_interp_cvars_aliases.cfg"


// --- Command= CQ/Clock CVARS ---
// Description: Enable/disable or check values for command queue / clock cvar settings.
alias cqclk_cvars_getvarstates "cl_clockdrift_max_ticks; cl_cq_min_queue; cq_buffer_bloat_msecs_max; sv_clockcorrection_msecs; sv_parallel_sendsnapshot"
alias cqs "cqclk_cvars_getvarstates; echo CQ/Clock CVARS GetVarState"
exec "set_cqclk_cvars_aliases.cfg"


// --- Command= Toggle Tick Timing Stats & Packet Receive Margin Spew ---
// Description: Check status of or Enable/disable set time spew console echo of various interp/cli/cq/clock/Tick/Net Rx-Tx statistics
alias timing_recv_getvarstates "exec cl_tickpacket_desired_queuelength_cvar_refrence_table.cfg; cl_tickpacket_recvmargin_spew_interval; cl_ticktiming print detail"
alias nts "echo Tick Timing & Packet Recieve Margin States; timing_recv_getvarstates"
exec "set_tick_packet_recv_marg_aliases.cfg"

