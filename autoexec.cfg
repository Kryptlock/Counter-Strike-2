//--- Command= Set Rate ---
// Description: Set the Max allowed game bandwidth.
//-- Ersatz Multiplers -> <|*|%=|> <1.666%=131.072> \ </Max/1.271%=1000.0> \ <1.250=983.04> \ <0.875%=688.128> \ <0.750%=589.824> \ </Min/0.625%=491.52> <0.125%=98.304>]
//
//--- Set Rate 786432 --
alias r7 "rate 786432; echo 'CMD [r7] executed, rate set to 786432'"
// This is the Erszatz 'Unlimited' option rate that is set via in-game Menu options UI.
//
//--- Set Rate 1000000 --
// Description: Set the Max allowed game bandwidth rate to a value of 1000000.
alias r1 "rate 1000000; echo 'CMD [r1] executed, rate set to 1000000'"; rate;
echo "[r1] set rate 1000000 CMD loaded"


