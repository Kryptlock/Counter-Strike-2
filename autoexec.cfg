//--- Command = Set Positive Log Flags ---
// Description: Reduces various console log flag echo statement spam even with devloper mode enabled (in-game console only)
// -- Flag '+DoNotEcho' --
alias lf_clcq_pos_dne ""log_flags "CL CommandQueue" +donotecho""
alias print_less "log_flags SOCache +donotecho; log_flags ResourceSystem +donotecho; log_flags RenderService +donotecho; log_flags RenderSystem +donotecho; log_flags Prediction +donotecho; log_flags ServerLog +donotecho; log_flags GCClient +donotecho; log_flags AnimResource +donotecho; lf_clcq_pos_dne"
//
// -- Short Keycode to exec 'print_Less' + 'Developer 0' + 'toggleconsole'--
alias ] "print_less;lf_clcq_pos_dne;d0;toggleconsole; echo 'Executed CMDs D0, print_less, lf_clcq_pos_dne'"


//--- Command = Set Negitive Log Flags ---
// -- Flag '-DoNotEcho' --
alias lf_clcq_neg_dne ""log_flags" "CL CommandQueue" -donotecho""
alias print_more "log_flags SOCache -donotecho; log_flags ResourceSystem +donotecho; log_flags RenderService -donotecho; log_flags RenderSystem -donotecho; log_flags Prediction -donotecho; log_flags ServerLog -donotecho; log_flags GCClient -donotecho; log_flags AnimResource +donotecho; lf_clcq_neg_dne"
//
// -- Short Keycode exec 'print_more' + 'developer 3' --
alias [ "print_more;d3; echo 'Executed CMDs D3 + print_more'"
log_flags "CL CommandQueue" +donotecho; 

//--- Command = Set Log Colors ---
alias lc_ani2_custom ""log_color "Animation 2" EFE4B0FF""
alias print_colors "log_color SteamNetSockets 0064FEAD; log_color NetSteamConn 00C0FEAD; log_color Matchmaking FF0000FF; log_color NetworkP2PService 00C0FEADlog_color InputService F5AFEEFF; log_color shooting FF0000FF; log_color Interpolation 8F8DD9FF; log_color NetworkService 00C0FEAD; log_color ServerLog 64C032FF; log_color GCClient 64C032FF; lc_ani2_custom"
// 
lc_ani2_custom; echo "log_color 'Animation 2' set to color 'EFE4B0FF'"
print_colors; echo "Executed print_colors CMD"


//--- Command = Toggle Net Graphs ---
// Description: Toggle visibility of various network telemetry graphs.
alias +toggle_net_graphs_on "cl_hud_telemetry_net_misdelivery_show 2; cl_hud_telemetry_net_quality_graph_show 2; cl_hud_telemetry_serverrecvmargin_graph_show 2; echo 'network telemetry graphs enabled'"
alias -toggle_net_graphs_on bind "C" "+toggle_net_graphs_off" 
alias +toggle_net_graphs_off "cl_hud_telemetry_net_misdelivery_show 0; cl_hud_telemetry_net_quality_graph_show 0; cl_hud_telemetry_serverrecvmargin_graph_show 0; echo 'network telemetry graphs disabled'"
alias -toggle_net_graphs_off bind "C" "+toggle_net_graphs_on" 
bind "C" "+toggle_net_graphs_on"
echo "Toggle Net Graphs CMD loaded"


//--- Command = Print MultiStats ---
// Description: Print various network & client stats from cmds located in large_print_stats.cfg. This prints a very large report of results
alias ss "exec large_print_stats.cfg; callvote_kick_template"
alias +ss "developer 3; net_showudp 1; echo net_showudp 1"
alias -ss "net_showudp 0; echo net_showudp 0; ss; developer 0"
bind "X" "+ss"
echo "Print MultiStats CMD loaded"


//--- Command = Async Print MultiStats ---
// Description: Requires sv_cheats 1 to function properly. Executes asynchronously various network & client stats related commands located in the autostats.cfg file. This prints a very large report of results. 
alias as "exec_async autostats.cfg"


//--- Command = Async Print MultiStats ---
// Description: To be used at teammenu on de_dust2. Asynchronusly executes contents in custom cfg 'quickperf' Performs A quick HW/SW test in a controlled low computational intensity enviroment.
alias qp "exec_async quickperf.cfg"
bind "F4" "qp; echo Initiated keybind to exec_async quickperf.cfg"


//--- Command = Full update and fetch stats
// Description: Lesser detailed stats with cl_fullupdate cmd
alias cfus "developer 3; echo 'Client requesting full update post verbose stats fetch' ss; cl_fullupdate; ss; echo 'Client request was sent - if accepted Client will initiate another verbose stats fetch on receipt'"
echo "CL full update + fetch stats CMD loaded (alias: <cfus>)"


