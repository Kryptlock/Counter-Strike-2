//--- Command = Cycle Show Fps States
alias "inc_showfps" "incrementvar cl_showfps 0 3 1; incrementvar cl_showpos 0 6 2"
bind "Z" "inc_showfps"


//--- Command = Toggle Damage Prediction ON/OFF 
// Description: Quickly toggle all local damage prediction options on/off simutaneously
alias cl_predict_fx_1 "cl_predict_body_shot_fx 1; cl_predict_head_shot_fx 1; cl_predict_kill_ragdolls 1; echo Damage Prediction= TRUE"
alias cl_predict_fx_0 "cl_predict_body_shot_fx 0; cl_predict_head_shot_fx 0; cl_predict_kill_ragdolls 0; echo Damage Prediction= FALSE"
alias +toggle_cl_predict_fx_1 "cl_predict_body_shot_fx; cl_predict_head_shot_fx; cl_predict_kill_ragdolls"
alias -toggle_cl_predict_fx_1 "cl_predict_fx_1; Bind F9 +toggle_cl_predict_fx_0"
alias +toggle_cl_predict_fx_0 "cl_predict_body_shot_fx; cl_predict_head_shot_fx; cl_predict_kill_ragdolls"
alias -toggle_cl_predict_fx_0 "cl_predict_fx_0; Bind F9 +toggle_cl_predict_fx_1"


//--- Command = Set Rate to X bytes
// Description: Set the Max allowed game bandwidth rate to//- Ersatz Multiplers -> <|*|%=|> <1.666%=131.072> \ </Max/1.271%=1000.0> \ <1.250=983.04> \ <0.875%=688.128> \ <0.750%=589.824> \ </Min/0.625%=491.52> <0.125%=98.304>]
//
//-- Set Rate 786432 
// Description: Set the Max allowed game bandwidth rate to the equivalent Erszatz 'Unlimited' option that is set when selecting [Max allowable game bandwidth] via in-game Menu options UI.
alias r7 "rate 786432; echo 'CMD [r7] executed, rate set to 786432'";echo '[r7]set rate 786432 CMD loaded'
//
//-- Set Rate 884736 
// Description: Set the Max allowed game bandwidth rate to a value of 884736, ideal for 5v5 Premier Bandwith limits
alias r8 "rate 884736; echo Premier mode max data bandwith set to 884736 bytes (Allocating 884KBps/10 GCs)"; echo '[r8] set rate 884736 CMD loaded'
//
//-- Set Rate 1000000 
// Description: This sets the true max allowed game bandwidth rate to a value of 1000000 in game.
alias r1 "rate 1000000; echo 'CMD [r1] executed, rate set to 1000000'";echo '[r1] set rate 1000000 CMD loaded'


//--- Command = List bound keys ---
alias kl "key_listboundkeys; echo '<~key_listboundkeys~> CMD executed'"
echo "List bound keys CMD (kl) bind loaded"


//--- Command = Fast Developer Toggle ---
// Description: Enables client Developer state & logging/output at the at various verbosity levels.
//
//- Developer 3 Enable
alias d3 "developer 3; echo 'Developer mode state 3 CMD executed'"
//- Developer 2 Enable
alias d2 "developer 2; echo 'Developer mode state 2 CMD executed'"
//
//- Developer 1 Enable
alias d1 "developer 1; echo 'Developer mode state 1 CMD executed'"
//
//- Developer Disable
alias d0 "developer 0; echo 'Developer mode state 0 CMD executed'"

